name: Build a new docker image release
on:
  workflow_dispatch:
    inputs:
      input-tag:
        description: 'Put a desired tag here (latest by default)'
        required: false
        default: 'latest'
  pull_request:
    types:
      - closed
    branches:
      - main

jobs:
  build:
    if: contains( github.event.pull_request.labels.*.name, 'CI') || github.event_name == 'workflow_dispatch'
    name: Create & push Docker image
    runs-on: [ self-hosted, linux, x64 ]

    steps:
      - uses: actions/checkout@v2
      - name: Prepare
        id: prep
        run: |
          INPUT_TAG=${{ github.event.inputs.input-tag }}
          TAG=$(echo $GITHUB_SHA | head -c7)
          IMAGE="f3joule/subsocial-parachain"
          echo "tagged_image=${IMAGE}:${TAG}" >> $GITHUB_OUTPUT
          echo" tag=${TAG}" >> $GITHUB_OUTPUT
          [ -z $INPUT_TAG ] && INPUT_TAG=latest
          echo "input_tag=${INPUT_TAG}" >> $GITHUB_OUTPUT
          echo "::debug::Output is $GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@master

      - name: Login to DockerHub
        uses: docker/login-action@master
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Cache Docker layers
        uses: actions/cache@v2
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-single-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-single-buildx

      - name: Build production image
        uses: docker/build-push-action@v2
        with:
          context: .
          builder: ${{ steps.buildx.outputs.name }}
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ steps.prep.outputs.tagged_image }}
            f3joule/subsocial-parachain:${{ steps.prep.outputs.input_tag }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
